  --ok:#6CC08F; --ok-soft:#1D3327; --warn:#E4AE57; --warn-soft:#3A2F1C;
  --shadow:0 6px 18px -10px rgba(0,0,0,.8); --brandbg:#141413; --logo:var(--img-logo-d); --og:var(--img-og-d); --sub:var(--img-sub-d);
  color-scheme:dark;
}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--hanko);outline-offset:2px}
.hidden{display:none!important}

/* ---------- Logo ---------- */
.seal{display:inline-grid;place-items:center;background:var(--hanko);color:#fff;border-radius:7px;font-weight:900;writing-mode:vertical-rl;letter-spacing:.05em;line-height:1}
.logo{display:flex;align-items:center;gap:10px}
.logo .word{font-family:"Archivo",sans-serif;font-stretch:78%;font-weight:900;font-size:22px;letter-spacing:.01em;line-height:1}
.logo .pill{font-family:"Archivo",sans-serif;font-stretch:85%;font-weight:700;font-size:10px;letter-spacing:.12em;border:1.5px solid var(--ink);border-radius:99px;padding:2px 7px}

/* ---------- Logo ---------- */
.lg{display:block;aspect-ratio:712/180;background:var(--logo) no-repeat left center/contain}
.lg.onred{background-image:var(--img-logo-d)}

/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:100;background:var(--brandbg);display:grid;place-items:center;transition:opacity .5s ease,visibility .5s;cursor:pointer}
#splash.out{opacity:0;visibility:hidden}
#splash{animation:spHide .5s ease 2.8s forwards}
@keyframes spHide{to{opacity:0;visibility:hidden}}
.sp{position:relative;width:min(560px,82vw);aspect-ratio:712/180}
.sp>div{position:absolute;background-repeat:no-repeat;background-size:100% 100%}
.sp .p-seal{left:0;top:0;width:18.54%;height:100%;background-image:var(--img-seal);animation:spStamp .55s cubic-bezier(.2,1.5,.4,1) .15s both}
.sp .p-seal::after{content:"";position:absolute;inset:3% 4%;border:2px solid #E0301E;border-radius:14px;opacity:0;animation:spRing .7s ease-out .6s}
.sp .p-og{left:19.66%;top:0;width:80.34%;height:69.44%;overflow:hidden}
.sp .p-og i{display:block;width:100%;height:100%;background:var(--og) no-repeat 0 0/100% 100%;animation:spUp .6s cubic-bezier(.2,.8,.2,1) .7s both}
.sp .p-sub{left:19.66%;top:69.44%;width:80.34%;height:30.56%;background-image:var(--sub);animation:spWipe .5s ease-out 1.25s both}
.sp-bar{position:absolute;left:50%;bottom:calc(56px + env(safe-area-inset-bottom,0px));width:150px;margin-left:-75px;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.sp-bar i{display:block;height:100%;width:100%;background:var(--hanko);transform-origin:left;animation:spLoad 2.4s cubic-bezier(.6,0,.3,1) both}
@keyframes spStamp{0%{transform:scale(2.6) rotate(-14deg);opacity:0}55%{opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes spRing{0%{opacity:.8;transform:scale(.95)}100%{opacity:0;transform:scale(1.35)}}
@keyframes spUp{from{transform:translateY(110%)}}
@keyframes spWipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes spLoad{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}

/* ---------- Login ---------- */
#login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
#login .art{background:var(--hanko);color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:48px}
#login .art .big{font-weight:900;font-size:clamp(120px,22vw,300px);line-height:.85;writing-mode:vertical-rl;white-space:nowrap;position:absolute;right:-.06em;top:-.04em;opacity:.95}
#login .art p{max-width:30ch;font-size:15px;margin:0;position:relative}
#login .art .tag{font-family:"Archivo",sans-serif;font-stretch:125%;font-weight:900;font-size:clamp(40px,6vw,76px);line-height:.9;position:relative;color:#2B2B2E}
#login .form{display:flex;flex-direction:column;justify-content:center;padding:48px clamp(24px,7vw,96px);gap:28px}
#login h1{font-size:30px;font-weight:700;margin:0;line-height:1.2}
#login .sub{color:var(--ink2);margin:6px 0 0}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:13px 18px;font-weight:700;font-size:15px;transition:border-color .15s,transform .1s}
.gbtn:hover{border-color:var(--ink)}
.gbtn:active{transform:scale(.99)}
.fine{color:var(--ink3);font-size:12px}
@media (max-width:760px){#login{grid-template-columns:1fr}#login .art{min-height:240px;padding:28px}}

/* ---------- App shell ---------- */
#app{height:100%;display:grid;grid-template-columns:248px 1fr}
aside{border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:22px;overflow:auto;background:var(--paper)}
.navgroup h4{margin:0 8px 6px;font-size:12px;color:var(--ink3);font-weight:500}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 8px;border-radius:7px;text-align:left;color:var(--ink2);font-weight:500}
.nav:hover{background:var(--sunk);color:var(--ink)}
.nav.on{background:var(--ink);color:var(--paper)}
.nav .count{margin-left:auto;font-size:12px;opacity:.7}
.dot{width:9px;height:9px;border-radius:3px;flex:none}
.user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid var(--line)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--ai);color:var(--paper);display:grid;place-items:center;font-weight:700;font-size:13px}
.user small{display:block;color:var(--ink3);font-size:11.5px}
main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;background:var(--paper);z-index:5}
.top h2{margin:0;font-size:22px;font-weight:900;margin-right:auto}
.seg{display:flex;background:var(--sunk);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;color:var(--ink2);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.search{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 10px;min-width:140px;flex:1;max-width:280px}
.search input{border:0;background:none;outline:none;width:100%}
.btn{border:0;background:var(--hanko);color:#fff;font-weight:700;padding:8px 14px;border-radius:9px}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.filters{display:flex;gap:8px;padding:10px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 10px;font-size:12.5px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--ink);color:var(--ink);font-weight:700}
.work{flex:1;display:flex;min-height:0}
.content{flex:1;overflow:auto;padding:20px 24px;min-width:0}
#notes{width:330px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--surface);min-height:0}
#notes.closed{display:none}
#notes .nh{padding:16px 16px 4px;display:flex;align-items:center;gap:8px}
#notes .nh h3{margin:0;font-size:16px;font-weight:900}
#notes .nh .x{margin-left:auto;border:0;background:none;color:var(--ink3);font-size:18px}
#notes .sub{padding:0 16px 10px;font-size:12px;color:var(--ink3)}
#notes .compose{padding:0 16px 12px}
#notes textarea{width:100%;min-height:105px;resize:vertical;background:var(--sunk);background-image:repeating-linear-gradient(to bottom,transparent 0 20px,var(--line) 20px 21px);background-position:0 9px;border:1px solid transparent;border-radius:9px;padding:9px 11px;outline:none;line-height:21px}
#notes textarea:focus{border-color:var(--ink3)}
#notes .row{display:flex;align-items:center;gap:8px;margin-top:8px}
#notes .row .fine{margin-right:auto}
#nlist{overflow:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:8px}
.note-i{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px}
.note-i .txt{white-space:pre-wrap}
.note-i .res{margin-top:6px;font-size:12px;color:var(--ink2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.note-i .res .link{border:0;background:none;padding:0;color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:2px;text-align:left}
.note-i .res .undo{margin-left:auto;border:0;background:none;color:var(--ink3);font-size:12px;padding:0}
.note-i.pending{border-style:dashed}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--hanko);animation:pl .8s infinite alternate}
@keyframes pl{to{opacity:.2}}
#notesBtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
@media (max-width:860px){#notes{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:72%;z-index:12;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -10px 30px -12px rgba(0,0,0,.35);padding-bottom:env(safe-area-inset-bottom,0px)}}

/* ---------- Today strip ---------- */
.today{display:flex;gap:24px;align-items:baseline;margin-bottom:18px;flex-wrap:wrap}
.today .greet{font-size:15px;color:var(--ink2)}
.today .greet b{color:var(--ink)}

/* ---------- Board ---------- */
.board{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:14px;align-items:start;min-width:1040px}
.col{background:var(--sunk);border-radius:12px;padding:10px;min-height:200px;transition:background .15s}
.col.over{background:var(--hanko-soft)}
.colhead{display:flex;align-items:center;gap:8px;padding:4px 4px 10px;font-weight:700}
.colhead .n{color:var(--ink3);font-weight:500}
.colhead .add{margin-left:auto;border:0;background:none;color:var(--ink3);font-size:18px;line-height:1;padding:0 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin-bottom:8px;cursor:grab;position:relative;overflow:hidden}
.card:hover{border-color:var(--ink3)}
.card.dragging{opacity:.4}
.card .title{font-weight:700;margin:6px 0 8px;line-height:1.35}
.card .meta{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--ink2)}
.prio{font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px}
.prio.alta{background:var(--hanko-soft);color:var(--hanko)}
.prio.media{background:var(--warn-soft);color:var(--warn)}
.prio.baixa{background:var(--ai-soft);color:var(--ai)}
.late{color:var(--hanko);font-weight:700}
.src{margin-left:auto;font-size:11px;color:var(--ink3)}
.bar{height:3px;background:var(--line);border-radius:3px;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.card.done .title{color:var(--ink3);text-decoration:line-through;text-decoration-thickness:1px}
.stamp{position:absolute;right:10px;top:8px;width:38px;height:38px;border:2.5px solid var(--hanko);color:var(--hanko);border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:18px;transform:rotate(-12deg);opacity:.85}
.stamp.anim{animation:stamp .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:rotate(-12deg) scale(2.2);opacity:0}100%{transform:rotate(-12deg) scale(1);opacity:.85}}
@media (prefers-reduced-motion:reduce){.stamp.anim{animation:none}}

/* ---------- List ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
th{font-size:12px;color:var(--ink3);font-weight:500;background:var(--sunk)}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sunk)}
.grouprow td{background:var(--paper);font-weight:700;font-size:12.5px;color:var(--ink2);cursor:default}
.ck{width:18px;height:18px;border:1.5px solid var(--ink3);border-radius:5px;display:inline-grid;place-items:center;background:none;padding:0;color:#fff}
.ck.on{background:var(--hanko);border-color:var(--hanko)}

/* ---------- Calendar ---------- */
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.calhead h3{margin:0;font-size:18px;min-width:180px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px;min-width:780px}
.cal .dow{background:var(--sunk);padding:7px 10px;font-size:12px;color:var(--ink3)}
.cal .day{background:var(--surface);min-height:108px;padding:6px 8px;display:flex;flex-direction:column;gap:4px}
.cal .day.out{background:var(--paper);color:var(--ink3)}
.cal .day .num{font-size:12.5px;font-weight:700}
.cal .day.now .num{background:var(--hanko);color:#fff;border-radius:6px;padding:0 6px;align-self:flex-start}
.ev{font-size:11.5px;border-radius:5px;padding:2px 6px;border-left:3px solid;background:var(--sunk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;text-align:left;border-top:0;border-right:0;border-bottom:0}

/* ---------- Connectors ---------- */
.conns{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;max-width:1100px}
.conn{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.conn .h{display:flex;align-items:center;gap:12px}
.conn .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:900;color:#fff;font-size:17px}
.conn h3{margin:0;font-size:16px}
.conn p{margin:0;color:var(--ink2);font-size:13px}
.conn .status{font-size:12px;font-weight:700}
.toggle{margin-left:auto;width:42px;height:24px;border-radius:99px;border:0;background:var(--line);position:relative;padding:0;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .18s}
.toggle.on{background:var(--ok)}
.toggle.on::after{left:21px}
.note{max-width:1100px;margin-bottom:18px;color:var(--ink2);font-size:13px;background:var(--sunk);border-radius:10px;padding:12px 14px}

/* ---------- Drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:21;box-shadow:-20px 0 40px -20px rgba(0,0,0,.4);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}}
.drawer header{display:flex;align-items:center;gap:8px;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer .body{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.drawer textarea.tt{font-size:20px;font-weight:700;border:0;background:none;resize:none;outline:none;width:100%;line-height:1.3}
.field{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:10px}
.field label{color:var(--ink3);font-size:13px}
.field select,.field input{background:var(--sunk);border:1px solid transparent;border-radius:7px;padding:6px 8px}
.checkitem{display:flex;align-items:center;gap:10px;padding:5px 0}
.checkitem span.done{color:var(--ink3);text-decoration:line-through}
.checkitem .x{margin-left:auto;border:0;background:none;color:var(--ink3)}
.addline{display:flex;gap:8px}
.addline input{flex:1;background:var(--sunk);border:0;border-radius:7px;padding:7px 9px}
.drawer textarea.notes{background:var(--sunk);border:0;border-radius:8px;padding:10px;min-height:90px;resize:vertical}
.drawer footer{margin-top:auto;padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:9px;font-weight:500;z-index:30}


/* ---------- Novos módulos ---------- */
.hello h1{margin:0;font-size:30px;font-weight:900;line-height:1.15}
.hello p{margin:4px 0 18px;color:var(--ink2)}
.hello p::first-letter{text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 16px}
.chead .tile{background:var(--sunk);border-color:transparent}
.tile .k{font-size:12.5px;color:var(--ink3)}
.tile .v{font-size:26px;font-weight:900;line-height:1.15;margin-top:3px;font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px;min-width:0}
.panel h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.panel.ai{background:var(--hanko-soft);border-color:transparent}
.panel.ai h3{color:var(--hanko)}
.aisum{margin:0 0 12px;font-size:15px;line-height:1.6;max-width:70ch}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:0 16px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;min-width:0}
.panel h3+.row,.panel summary+.row{border-top:0}
.row .t{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row:hover .t{text-decoration:underline;text-underline-offset:2px}
.row2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.6;cursor:default}
.iconbtn.sm{width:28px;height:28px;font-size:16px}
.money{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.money.paid,.paid{color:var(--ok)}
.badge{font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--sunk);color:var(--ink2);display:inline-flex;gap:4px;align-items:center}
.badge.wait{background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.meta>span{display:inline-flex;align-items:center;gap:3px}
.tm-run{color:var(--hanko);font-weight:700}
.stages{display:flex;gap:3px;margin-top:10px}
.stages i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.stages i.on{background:var(--ink3)}
.stages i.cur{background:var(--hanko)}
.stagelbl{font-size:11px;color:var(--ink3);margin-top:4px}
.card.done .stages i{background:var(--ok)}
.playbtn{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink2);padding:0}
.playbtn:hover{border-color:var(--ink3);color:var(--ink)}
.playbtn.run{background:var(--hanko);border-color:var(--hanko);color:#fff}
#timerChip{display:inline-flex;align-items:center;gap:8px;background:var(--hanko);color:#fff;border:0;border-radius:99px;padding:7px 12px;font-weight:700;font-variant-numeric:tabular-nums;max-width:280px}
#timerChip .cl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;opacity:.9}
#timerChip.hidden{display:none}
@media (max-width:1500px){.top .bl{display:none} #notesBtn{padding:8px 10px}}
@media (max-width:1300px){#timerChip .cl{display:none}}
@media (max-width:560px){.top .bl2{display:none} #newBtn{padding:8px 10px} .top h2{font-size:19px}}
.sec{display:flex;flex-direction:column;gap:8px}
.sec>b{display:flex;align-items:center;gap:6px}
.stepper{display:flex;gap:4px;flex-wrap:wrap}
.stepper button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:12.5px;color:var(--ink2)}
.stepper button.past{background:var(--sunk);color:var(--ink)}
.stepper button.cur{background:var(--hanko);color:#fff;border-color:var(--hanko);font-weight:700}
.timerbig{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;min-width:110px}

/* ---------- Infos do cliente, logo, perfil ---------- */

.card.infocard{background:var(--note);border-color:var(--note-line);cursor:pointer;background-image:repeating-linear-gradient(to bottom,transparent 0 21px,var(--note-line) 21px 22px);background-position:0 34px}

.infocard a,.padlinks a{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.drawer.padwide{width:min(620px,100%)}
.padarea{width:100%;min-height:52vh;resize:vertical;background:var(--note);background-image:repeating-linear-gradient(to bottom,transparent 0 23px,var(--note-line) 23px 24px);background-position:0 12px;border:1px solid var(--note-line);border-radius:10px;padding:12px 14px;line-height:24px;outline:none;font-size:14px}

.btn.wa{background:#25D366;color:#073B1F}
.btn.wa:hover{background:#1EBE5B}
a.btn{text-decoration:none}
.link.sm{font-size:12px;color:var(--ink3);font-weight:500}
.cobs textarea{min-height:110px;resize:vertical;line-height:1.55}
button.user{width:100%;border:0;background:none;text-align:left;cursor:pointer;border-top:1px solid var(--line);border-radius:0}

.avatar{overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}

.pphoto{width:96px;height:96px;border-radius:50%;background:var(--ai);color:var(--paper);display:grid;place-items:center;font-size:30px;font-weight:900;cursor:pointer;overflow:hidden;position:relative;flex:none}

/* ---------- Grupos ---------- */
.grow{display:flex;align-items:center}

/* ---------- Orçamento (modelo Ogura) ---------- */
.qdocwrap{position:sticky;top:0;overflow:hidden}
.qd2{width:794px;transform-origin:top left;display:flex;flex-direction:column;gap:18px;--qr:#E0301E;--qk:#141414;--qp:#EFE8DF;--ql:#CFC6B8}
.qpage{width:794px;min-height:1123px;background:var(--qp);color:var(--qk);padding:34px 50px 18px;display:flex;flex-direction:column;box-shadow:0 1px 0 rgba(0,0,0,.05),0 18px 40px -20px rgba(0,0,0,.45);border-radius:4px;font-family:"Archivo","Helvetica Neue",Arial,sans-serif;font-size:13.5px;line-height:1.45;-webkit-print-color-adjust:exact;print-color-adjust:exact}

.qp-head{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:12px;border-bottom:2px solid var(--qk)}

.qp-meta b.red{color:var(--qr)}
.qp-client{display:grid;grid-template-columns:200px 1fr;gap:26px;margin:10px 0 0}
.qp-clogo{background:#F6F2EC;border:1px solid var(--ql);border-radius:4px;aspect-ratio:200/96;display:grid;place-items:center;padding:16px;overflow:hidden}
.qp-clogo img{max-width:100%;max-height:100%;object-fit:contain}
.qp-clogo span{font-stretch:110%;font-weight:900;font-size:22px;text-align:center;color:#3A3530}
.qp-client h2{font-stretch:110%;font-weight:800;font-size:23px;margin:2px 0 6px;line-height:1.15}
.qp-client p{margin:0 0 2px;font-size:13px}
.qp-sec{display:flex;align-items:center;gap:12px;font-stretch:110%;font-weight:800;font-size:19px;margin:14px 0 6px}
.qp-sec i{font-style:normal;font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:11px;color:var(--qr)}
.qp-sec::after{content:"";flex:1;height:1px;background:var(--ql);margin-left:6px}
table.qp-t{width:100%;border-collapse:collapse;min-width:0;background:none}
.qp-t th{background:none;font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:10.5px;letter-spacing:.12em;color:#6E675D;text-align:left;padding:6px 8px;border-bottom:2px solid var(--qk)}
.qp-t td{padding:5px 8px;border-bottom:1px solid var(--ql);vertical-align:top;font-size:13.5px;color:var(--qk)}
.qp-t td:nth-child(3),.qp-t th:nth-child(3){text-align:center;width:46px}
.qp-t td:nth-child(4),.qp-t th:nth-child(4){text-align:right;width:96px;font-family:"IBM Plex Mono",monospace;font-size:13px;white-space:nowrap}
.qp-t td.ref{font-family:"IBM Plex Mono",monospace;font-size:12.5px;width:92px;white-space:nowrap}
.qp-t td.ref em{font-style:normal;font-size:9.5px;letter-spacing:.1em;background:#E2D9CC;padding:2px 5px;border-radius:3px;margin-left:6px;font-weight:500}
.qp-t td small{display:block;font-size:11px;color:#5E574D;margin-top:1px;line-height:1.35}

.qp-total{background:var(--qk);color:#F6F2EC;border-radius:4px;margin-top:12px;padding:11px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}

.qp-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--ql);display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;color:#6E675D}

.qp-scope{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 34px}

.qp-scope li::before{content:"";position:absolute;left:0;top:13px;width:9px;height:9px;border-radius:50%;background:var(--qr)}
.qp-notes{margin:0;font-size:13.5px}
.qp-pay{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:22px}
.qp-opt{border:1.5px solid var(--qk);border-radius:4px;padding:16px 20px}
.qp-opt.red{background:var(--qr);border-color:var(--qr);color:#fff}
.qp-opt.red .lab{color:#FFD9D2}
.qp-opt h4{font-stretch:110%;font-weight:800;font-size:20px;margin:6px 0 10px}
.qp-opt .ln{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed rgba(0,0,0,.25);font-size:13.5px}
.qp-opt.red .ln{border-color:rgba(255,255,255,.45)}
.qp-opt .ln b{font-family:"IBM Plex Mono",monospace;font-size:13px}
.qp-opt p{margin:12px 0 0;font-size:12.5px;opacity:.85}
.qp-valid{display:flex;align-items:center;gap:26px;border:1.5px solid var(--qr);border-radius:4px;padding:16px 22px;margin-top:20px;font-size:13.5px}

.qp-sign .sig img{max-height:110px;max-width:240px;margin-bottom:-14px}
.qitems{display:flex;flex-direction:column;gap:10px;margin:6px 0 10px}
.qitem{display:grid;grid-template-columns:60px minmax(0,1fr) 56px 96px 26px;grid-template-areas:"ref t q v x" ". desc desc tot tot";gap:6px;align-items:center}
.qitem.h{grid-template-areas:none;font-size:12px;color:var(--ink3)}

.qitem input[data-k=ref]{grid-area:ref}.qitem input[data-k=d]{grid-area:t;font-weight:700}.qitem input[data-k=q]{grid-area:q}.qitem input[data-k=v]{grid-area:v}

.qform h3{margin:6px 0 10px}
.qpayform{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.ck2{display:flex;align-items:center;gap:8px;font-weight:700}

.signrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0 4px}
.signbox{min-width:220px;height:64px;border:1.5px dashed var(--line);border-radius:10px;display:grid;place-items:center;cursor:pointer;padding:6px 12px;background:#fff;color:#666;font-size:12.5px}

.signbox span{display:inline-flex;gap:6px;align-items:center}

.bq{display:flex;flex-direction:column;gap:4px}
.bq span{font-size:12.5px;color:var(--ink2);font-weight:500}

/* ---------- Tons por coluna (referência do usuário) ---------- */
.col{--cc:#8E8E8E;padding:0;overflow:hidden;border:1px solid color-mix(in srgb,var(--cc) 22%,var(--line));
  background:linear-gradient(to bottom,color-mix(in srgb,var(--cc) 9%,var(--sunk)) 0,var(--sunk) 240px)}

.col .colhead::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--cc);flex:none}

.col.over{background:color-mix(in srgb,var(--cc) 16%,var(--sunk))}

/* infos fixas no tom neutro dos cards */
.card.infocard{background:var(--surface);background-image:none;border-color:var(--line)}
.card.infocard:hover{border-color:var(--ink3)}
.infocard .ih{font-size:13.5px;margin-bottom:6px}
.infocard .ih span{border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:1px 7px;font-size:10.5px;letter-spacing:.04em}

/* ícones nos tiles */
.tile.hasic{position:relative;padding-right:56px}
.tile .tic{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--ink3);opacity:.85}

/* ---------- Ferramentas ---------- */
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;align-items:start}
.tools .panel{margin:0}
.tools select,.tools input:not([type=checkbox]){width:100%;background:var(--sunk);border:1px solid transparent;border-radius:7px;padding:7px 9px;outline:none}

.tres{background:var(--sunk);border-radius:10px;padding:12px 14px;margin:4px 0 0;display:flex;flex-direction:column;gap:2px}
.tres b{font-size:28px;font-weight:900;line-height:1.15;font-variant-numeric:tabular-nums}
#wdOut{font-size:20px}
.tdet{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.tdet summary{cursor:pointer;font-weight:700}
.cvp{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.cvp .chip{cursor:pointer}
.cvt td{font-variant-numeric:tabular-nums}
/* ---------- Paleta ---------- */
.palwrap{margin-top:12px}
.plab{font-size:12px;color:var(--ink3);display:block;margin-bottom:6px}
.pal{display:flex;flex-wrap:wrap;gap:10px}
.sw2{position:relative;width:132px;background:var(--sunk);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:2px}
.sw2 .chipc{width:100%;height:56px;border-radius:7px;border:1px solid rgba(0,0,0,.08);cursor:copy;padding:0}
.sw2 .pname{background:none;border:0;font-weight:700;font-size:12.5px;padding:4px 0 0;outline:none;width:100%}
.sw2 .pv{font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,monospace}
.sw2 .x{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;padding:0;opacity:0;transition:opacity .15s}
.sw2:hover .x{opacity:1}
.sw2.add{justify-content:center;gap:6px}
.sw2.add input[type=color]{width:100%;height:40px;border:0;padding:0;background:none;border-radius:7px;cursor:pointer}
.sw2.add input#cpHex{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;width:100%}
/* ---------- Referências (moodboard) ---------- */
.mood{position:fixed;inset:0;z-index:80;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.mbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.mtitle{display:flex;flex-direction:column;line-height:1.2}
.mhint{max-width:420px}
.mzoom{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:9px;padding:2px}
.mzoom button{border:0;background:none;width:28px;height:28px;border-radius:7px;font-size:16px;color:var(--ink2)}
.mzoom button:hover{background:var(--sunk);color:var(--ink)}
.mzoom #mdFit{width:auto;padding:0 8px}
.mzoom span{min-width:44px;text-align:center;font-size:12.5px;font-variant-numeric:tabular-nums}
.mwrap{flex:1;position:relative;overflow:auto;cursor:grab;background-color:var(--paper);background-image:radial-gradient(circle,var(--line) 1px,transparent 1.2px);background-size:24px 24px;background-attachment:local}
.mwrap.panning{cursor:grabbing}
.mwrap.over{outline:2px dashed var(--hanko);outline-offset:-8px}
.msize{position:absolute;left:0;top:0;pointer-events:none}
.mcanvas{position:absolute;left:0;top:0;width:6000px;height:4500px;transform-origin:0 0}
.mitem{position:absolute;cursor:move;border-radius:6px;box-shadow:0 8px 22px -12px rgba(0,0,0,.45);background:var(--surface);user-select:none;-webkit-user-select:none;touch-action:none}
.mitem img{width:100%;height:100%;object-fit:cover;border-radius:6px;display:block;pointer-events:none}
.mitem.sel{outline:2px solid var(--hanko);outline-offset:2px}
.mitem.text{background:#F7F3EC;color:#1A1A1A;display:flex;flex-direction:column;border:1px solid #E7DFD3}
.mitem.text .mtbar{height:12px;border-bottom:1px dashed #E2D9CC;flex:none}
.mitem .mtext{flex:1;padding:10px 12px;outline:none;font-size:14px;line-height:1.45;overflow:auto;white-space:pre-wrap;cursor:text;user-select:text;-webkit-user-select:text}
.mitem .mtext:empty::before{content:"Escreva aqui…";color:#9A9287}
.mdel{position:absolute;top:-10px;right:-10px;width:24px;height:24px;border-radius:50%;border:0;background:#1A1A1A;color:#fff;font-size:14px;line-height:1;padding:0;opacity:0;transition:opacity .15s;z-index:2}
.mitem:hover .mdel,.mitem.sel .mdel{opacity:1}
.mh{position:absolute;right:-6px;bottom:-6px;width:16px;height:16px;border-radius:4px;background:var(--hanko);border:2px solid #fff;cursor:nwse-resize;opacity:0;transition:opacity .15s}
.mitem:hover .mh,.mitem.sel .mh{opacity:1}
.mempty{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;display:flex;flex-direction:column;gap:6px;color:var(--ink3);pointer-events:none;position:fixed}
.mempty b{color:var(--ink);font-size:18px}

/* ---------- Página de briefings ---------- */
.cinfo select{width:100%;background:var(--sunk);border:1px solid transparent;border-radius:7px;padding:7px 9px;outline:none;color:var(--ink)}
.cinfo select:focus{border-color:var(--ink3)}
.cinfo select{width:100%;background:var(--sunk);border:1px solid transparent;border-radius:7px;padding:7px 9px;outline:none}
.cinfo select:focus{border-color:var(--ink3)}
.bfrow .t small{display:block;font-weight:400;font-size:12px;color:var(--ink3)}
.bfprog{width:90px;height:5px;border-radius:3px;background:var(--line);overflow:hidden;flex:none}
.bfprog i{display:block;height:100%;background:var(--ok)}

/* ---------- QR Code ---------- */
.tools{grid-template-columns:repeat(auto-fit,minmax(440px,1fr))}
.qtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.qtabs .chip{cursor:pointer}
.qrgrid{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:16px;align-items:start}
@media (max-width:560px){.qrgrid{grid-template-columns:1fr}}
.qrtool .span2{grid-column:1/-1}
.qrtool textarea{width:100%;background:var(--sunk);border:1px solid transparent;border-radius:7px;padding:7px 9px;resize:vertical;outline:none}
.qrtool input[type=color]{height:34px;padding:2px;cursor:pointer}
.qbg{display:flex;align-items:center;gap:8px}
.qbg input[type=color]{flex:1;min-width:0}
.qbg .ck2{font-weight:500;font-size:12.5px;white-space:nowrap}
.qrprev{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.qrbox{width:236px;height:236px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;padding:8px}
.qrbox.transp{background-color:#fff;background-image:linear-gradient(45deg,#e8e8e8 25%,transparent 25%,transparent 75%,#e8e8e8 75%),linear-gradient(45deg,#e8e8e8 25%,transparent 25%,transparent 75%,#e8e8e8 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.qrbox .fine{padding:0 16px}
.qrprev select{background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:12.5px}

/* ---------- Nuvem ---------- */
.cgate{position:fixed;inset:0;z-index:150;background:var(--paper);display:grid;place-items:center;padding:24px}
.cgbox{width:min(380px,100%);display:flex;flex-direction:column;gap:10px;text-align:center}
.cgbox h2{margin:0;font-size:22px}
.cgbox input{background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-size:15px;outline:none}
.cgbox input:focus{border-color:var(--ink3)}
.cdot2{width:10px;height:10px;border-radius:50%;flex:none;background:var(--ok)}
.cdot2.busy{background:#D98A1C}.cdot2.err{background:var(--hanko)}
.cchoice{background:var(--warn-soft);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.bflink{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--sunk);border-radius:9px;padding:8px 10px}
.bflink code{flex:1;min-width:140px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---------- Trello ---------- */
.trp{max-width:1100px}
.trp h3 .ic.sm{width:26px;height:26px;border-radius:7px;display:inline-grid;place-items:center;color:#fff}
.steps{margin:0 0 14px;padding-left:20px;display:grid;gap:8px;color:var(--ink2);max-width:80ch}
.steps b{color:var(--ink)}
.link{border:0;background:none;padding:0;color:#0C66E4;font-weight:700;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.trboards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-bottom:6px}
.trb{display:flex;align-items:center;gap:10px;background:var(--sunk);border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:500}
.trb input{width:16px;height:16px;accent-color:#0C66E4}
/* ---------- Orçamentos ---------- */
.qbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.qstatus{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-weight:700}
.qgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1180px){.qgrid{grid-template-columns:1fr}}
.qitems{display:flex;flex-direction:column;gap:6px;margin:6px 0 10px}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) 58px 96px 92px 26px;gap:6px;align-items:center}
.qrow input{background:var(--sunk);border:1px solid transparent;border-radius:7px;padding:7px 8px;width:100%;min-width:0;outline:none}
.qrow input:focus{border-color:var(--ink3)}
.qrow.h{font-size:12px;color:var(--ink3)}
.qrow .tot{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:12.5px}
.qrow .x{border:0;background:none;color:var(--ink3);font-size:17px;padding:0}
.qsug{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0 16px}
.qsug .chip{cursor:pointer}
.qform textarea{resize:vertical}
.qdocwrap{position:sticky;top:0}
.qdoc{background:#fff;color:#1A1A1A;border-radius:6px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 14px 34px -18px rgba(0,0,0,.4);padding:40px 42px;font-size:13px;line-height:1.5;min-height:640px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.qd-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:20px;border-bottom:2px solid #1A1A1A}
.qd-logo{width:min(210px,45%);aspect-ratio:712/180;background:var(--img-logo-l) no-repeat left center/contain;flex:none}
.qd-meta{text-align:right;display:flex;flex-direction:column;font-size:12px;color:#555}
.qd-meta b{font-size:20px;color:#E0301E;font-weight:900;line-height:1.2}
.qd-to{padding:18px 0 14px;display:flex;flex-direction:column}
.qd-to span:first-child{font-size:11px;color:#888}
.qd-to b{font-size:18px;line-height:1.3}
table.qd-t{width:100%;border-collapse:collapse;min-width:0}
.qd-t th{background:none;color:#888;font-size:11px;font-weight:500;border-bottom:1px solid #ddd;padding:6px 4px}
.qd-t td{padding:8px 4px;border-bottom:1px solid #eee;font-size:12.5px;color:#1A1A1A}
.qd-t td:not(:first-child),.qd-t th:not(:first-child){text-align:right;white-space:nowrap}
.qd-sum{margin-left:auto;width:min(260px,100%);margin-top:12px}
.qd-sum div{display:flex;justify-content:space-between;padding:3px 0}

.qd-total span:last-child{color:#E0301E}
.qd-terms{margin-top:26px;display:grid;gap:10px}
.qd-terms span{display:block;font-size:11px;color:#888}

.qd-foot b{color:#1A1A1A}
.badge.no{background:var(--sunk);color:var(--ink3)}

function norm(t){
  const x=SEEDX[t.id]||{};
  const def={stage:0,rounds:0,time:0,value:0,paid:false,files:null,approval:null,doneAt:null};
  for(const k in def) if(t[k]===undefined) t[k]=x[k]!==undefined?x[k]:def[k];
  if(!t.files) t.files=[];
  if(t.status==="done"&&!t.doneAt) t.doneAt=todayISO();
  return t;
}

function visible(){

    if(S.scope==="today" && !(t.status!=="done" && t.due && t.due<=todayISO())) return false;
    if(S.scope==="trello" && t.src!=="trello") return false;
    if(S.client && t.client!==S.client) return false;

    if(S.q){ const q=S.q.toLowerCase(); if(!(t.title.toLowerCase().includes(q)||t.client.toLowerCase().includes(q))) return false; }
    return true;
  });
}

function greeting(){ const h=new Date().getHours(); return h<12?"Bom dia":h<18?"Boa tarde":"Boa noite"; }

function bindDrag(){
  document.querySelectorAll(".card").forEach(c=>{
    c.addEventListener("dragstart",e=>{ e.dataTransfer.setData("text/plain",c.dataset.id); c.classList.add("dragging"); });
    c.addEventListener("dragend",()=>c.classList.remove("dragging"));
  });
  document.querySelectorAll(".col").forEach(col=>{
    col.addEventListener("dragover",e=>{ e.preventDefault(); col.classList.add("over"); });
    col.addEventListener("dragleave",()=>col.classList.remove("over"));
    col.addEventListener("drop",e=>{ e.preventDefault(); col.classList.remove("over");
      const t=S.tasks.find(x=>x.id==e.dataTransfer.getData("text/plain")); if(!t) return;
      setStatus(t,col.dataset.col); });
  });
}
function setStatus(t,st){
  if(t.status===st) return;
  t.status=st;
  if(st==="done"){ S.justDone=t.id; t.doneAt=todayISO(); if(running(t)) stopTimer(); toast("Tarefa concluída"); }
  save(); render();
}

async function summarize(){
  const el=$("#aiSum"), btn=$("#sumBtn"); if(!el) return;
  el.textContent="Pensando…"; btn.disabled=true;
  const open=S.tasks.filter(t=>t.status!=="done").map(t=>({titulo:t.title,cliente:t.client,prazo:t.due,atrasada:isLate(t),prioridade:t.prio,etapa:STAGES[t.stage],aguardando_cliente:t.approval?.status==="pending"}));
  const prompt=`Você é o assistente do app de tarefas de um designer freelancer chamado Akio (Ogura Studio). Hoje é ${todayISO()}.
Tarefas abertas (JSON): ${JSON.stringify(open)}
Escreva 2 ou 3 frases curtas em português do Brasil, falando direto com o Akio: por onde começar hoje, o que está atrasado ou em risco e o que depende do cliente. Sem listas, sem markdown, sem saudação.`;
  let text=null;
  const sample=await getSample();
  if(sample){ try{ const r=await sample(prompt,{modelTier:"quick",cache:false,onText:({text})=>{ el.textContent=text; }}); text=r.text; }catch(e){ text=null; } }

function monthStats(off){
  const x=new Date(); x.setDate(1); x.setMonth(x.getMonth()+off);
  const ym=`${x.getFullYear()}-${pad(x.getMonth()+1)}`;
  const jobs=S.tasks.filter(t=>t.status==="done"&&t.value&&(t.doneAt||"").startsWith(ym));
  const by={};
  jobs.forEach(t=>{ const b=by[t.client]||(by[t.client]={n:0,total:0,paid:0}); b.n++; b.total+=t.value; if(t.paid) b.paid+=t.value; });
  const sum=f=>jobs.filter(f).reduce((s,t)=>s+t.value,0);
  return {label:x.toLocaleDateString("pt-BR",{month:"long",year:"numeric"}),jobs,by,billed:sum(()=>true),received:sum(t=>t.paid),toReceive:sum(t=>!t.paid),
    production:S.tasks.filter(t=>t.status!=="done").reduce((s,t)=>s+(t.value||0),0)};
}

}

const brl=v=>(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const dateBR=iso=>iso?new Date(iso+"T12:00").toLocaleDateString("pt-BR"):"";
const qSub=q=>q.items.reduce((s,i)=>s+(+i.q||0)*(+i.v||0),0);
const qTotal=q=>Math.max(0,qSub(q)-(+q.discount||0));
function nextNum(){ const y=new Date().getFullYear(); const n=Math.max(0,...S.quotes.filter(q=>q.num.includes(`-${y}-`)).map(q=>+q.num.split("-")[2]||0))+1; return `ORC-${y}-${pad3(n)}`; }
const pad3=n=>String(n).padStart(3,"0");
function blankQuote(){ return {id:"q"+Date.now(),num:nextNum(),client:S.client||"",project:"",date:todayISO(),validity:15,items:[{d:"",q:1,v:0}],discount:0,

function qDefaults(q){
  const def={intro:"",service:"",unit:"",scope:"",pay1:true,pay1Pct:50,pay1Note:"Pagamento via Pix ou transferência bancária.",pay2:true,pay2N:2,pay2Note:"Pagamento por link enviado pelo Ogura Studio após a aprovação."};
  for(const k in def) if(q[k]===undefined) q[k]=def[k];
  q.items.forEach(i=>{ if(i.ref===undefined) i.ref=""; if(i.desc===undefined) i.desc=""; });
  return q;
}
const MES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function payText(q){ qDefaults(q); const t=qTotal(q), a=[];
  if(q.pay1){ const p=+q.pay1Pct||50; a.push(p>=100?`À vista ${brl(t)}`:`${p}% na aprovação (${brl(t*p/100)}) e ${100-p}% na entrega (${brl(t*(100-p)/100)})`); }
  if(q.pay2) a.push(`cartão em até ${q.pay2N}× de ${brl(t/(+q.pay2N||1))}`);
  return a.join(" ou "); }

function fitDoc(){
  const wrap=document.querySelector(".qdocwrap"), d=document.querySelector("#qdoc .qd2"); if(!wrap||!d) return;
  const s=Math.min(1,wrap.clientWidth/794); d.style.transform=`scale(${s})`; wrap.style.height=Math.ceil(d.offsetHeight*s)+"px";
}

function quoteToTask(q){
  const ex=q.taskId&&S.tasks.find(t=>t.id==q.taskId);
  if(ex){ S.page="tasks"; S.client=null; render(); return openTask(ex.id); }
  const c=(q.client||"").trim()||"Ogura Studio";
  if(!CLIENTS[c]){ const pal=["#7A6A58","#5B7A6E","#7B5E7B","#8A5A44","#4F6D8F"]; CLIENTS[c]=pal[Object.keys(S.extraClients).length%pal.length]; S.extraClients[c]=CLIENTS[c]; }
  const t=norm({id:Date.now(),title:q.project||`Projeto ${c}`,client:c,prio:"media",status:"todo",due:d(15),src:"manual",
    check:q.items.filter(i=>i.d).map(i=>({t:i.q>1?`${i.d} (${i.q})`:i.d,ok:false})),
    notes:[`Orçamento ${q.num}`,q.deadline&&`Prazo: ${q.deadline}`,`Pagamento: ${payText(q)}`,q.notes].filter(Boolean).join("\n"),value:qTotal(q)});
  S.tasks.unshift(t); q.status="approved"; q.approvedAt=todayISO(); q.taskId=t.id; save(); render(); toast("Aprovado: tarefa criada com o valor de "+brl(qTotal(q)));
}

const PALETTE=["#E0301E","#2C3A5C","#D96C9A","#E08A1E","#4A6B8A","#1F8A8A","#6B4FBB","#5E9B3C","#3E8FC7","#8A6D3B","#C2410C","#0C66E4","#7A6A58","#B7791F"];
let confirmAct=null;
function addClient(name,color){
  name=(name||"").trim(); if(!name) return toast("Digite o nome do cliente");
  if(Object.keys(CLIENTS).some(c=>c.toLowerCase()===name.toLowerCase())) return toast("Esse cliente já existe");
  CLIENTS[name]=color||PALETTE[Object.keys(CLIENTS).length%PALETTE.length]; save(); render(); toast("Cliente cadastrado: "+name);
}
function renameClient(old,name){
  name=name.trim(); if(!name||name===old) return render();
  if(CLIENTS[name]) { toast("Já existe um cliente com esse nome"); return render(); }
  const order=Object.entries(CLIENTS); for(const k in CLIENTS) delete CLIENTS[k];
  order.forEach(([k,v])=>{ CLIENTS[k===old?name:k]=v; });
  S.tasks.forEach(t=>{ if(t.client===old) t.client=name; });
  S.quotes.forEach(q=>{ if(q.client===old) q.client=name; });
  S.templates.forEach(tp=>{ if(tp.client===old) tp.client=name; });
  S.groups.forEach(g=>{ g.members=g.members.map(m=>m===old?name:m); });
  if(S.clientInfo[old]){ S.clientInfo[name]=S.clientInfo[old]; delete S.clientInfo[old]; }
  if(S.client===old) S.client=name;
  save(); render(); toast("Cliente renomeado");
}
function deleteClient(c){
  delete CLIENTS[c]; if(!Object.keys(CLIENTS).length) CLIENTS["Ogura Studio"]="#E0301E";
  const fb=Object.keys(CLIENTS)[0];
  S.tasks.forEach(t=>{ if(t.client===c) t.client=fb; });
  S.templates.forEach(tp=>{ if(tp.client===c) tp.client=fb; });
  S.groups.forEach(g=>{ g.members=g.members.filter(m=>m!==c); });
  delete S.clientInfo[c]; if(S.client===c) S.client=null;
  save(); render(); toast(`Cliente apagado. As tarefas dele foram para ${fb}.`);
}
function resetAll(demo){
  S.timer=null; IDB.clear().catch(()=>{});
  for(const k in CLIENTS) delete CLIENTS[k];
  Object.assign(CLIENTS, demo?DEMO_CLIENTS:{"Ogura Studio":"#E0301E"});
  Object.assign(S,{groups:[],groupId:null,tasks:demo?seed():[],templates:demo?seedTpl():[],quotes:demo?seedQuotes():[],notes:[],clientInfo:{},daylog:{},summary:null,client:null,quoteId:null,page:"today"});
  save(); render(); renderNotes(); toast(demo?"Dados de exemplo carregados":"Tudo zerado. Comece cadastrando seus clientes.");
}
async function backupFull(){ const d=backupData(); try{ d.media=await IDB.all(); }catch(e){} return d; }
async function exportBackup(){
  const data=await backupFull();
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:"application/json"}));
  a.download=`ogura-studio-backup-${todayISO()}.json`; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
  toast("Backup gerado");
}
function importBackup(file){
  const r=new FileReader(); r.onload=()=>{ try{
    const d=JSON.parse(r.result); if(d.app!=="Ogura Studio"||!Array.isArray(d.tasks)) throw 0;
    for(const k in CLIENTS) delete CLIENTS[k]; Object.assign(CLIENTS,d.clients||{"Ogura Studio":"#E0301E"});
    if(d.media) Object.entries(d.media).forEach(([k,v])=>{ MEDIA[k]=v; IDB.set(k,v).catch(()=>{}); });
    Object.assign(S,{briefs:d.briefs||S.briefs,tasks:d.tasks,templates:d.templates||[],quotes:d.quotes||[],notes:d.notes||[],clientInfo:d.clientInfo||{},daylog:d.daylog||{},groups:d.groups||[],profile:d.profile||S.profile,groupId:null,client:null,quoteId:null});
    save(); render(); renderNotes(); toast("Backup restaurado");
  }catch(e){ toast("Esse arquivo não é um backup do Ogura Studio"); } }; r.readAsText(file);
}

/* ---------- Mídia em IndexedDB (imagens das referências) ---------- */
const IDB=(()=>{ let dbp=null;
  const open=()=>dbp||(dbp=new Promise((ok,bad)=>{ const r=indexedDB.open("ogura-media",1); r.onupgradeneeded=()=>r.result.createObjectStore("m"); r.onsuccess=()=>ok(r.result); r.onerror=()=>bad(r.error); }));
  const tx=async(mode,fn)=>{ const db=await open(); return new Promise((ok,bad)=>{ const t=db.transaction("m",mode), req=fn(t.objectStore("m")); t.oncomplete=()=>ok(req&&req.result); t.onerror=()=>bad(t.error); }); };
  return { get:k=>tx("readonly",s=>s.get(k)), set:(k,v)=>tx("readwrite",s=>s.put(v,k)), del:k=>tx("readwrite",s=>s.delete(k)), clear:()=>tx("readwrite",s=>s.clear()),
    all:async()=>{ const db=await open(); return new Promise((ok,bad)=>{ const out={}, t=db.transaction("m"), c=t.objectStore("m").openCursor();
      c.onsuccess=()=>{ const cur=c.result; if(cur){ out[cur.key]=cur.value; cur.continue(); } }; t.oncomplete=()=>ok(out); t.onerror=()=>bad(t.error); }); } };
})();
const MEDIA={};
async function mediaGet(id){ if(MEDIA[id]) return MEDIA[id]; try{ const u=await IDB.get(id); if(u) MEDIA[id]=u; return u; }catch(e){ return null; } }

function hexToRgb(h){ h=(h||"").replace("#",""); if(h.length===3) h=h.split("").map(x=>x+x).join(""); const n=parseInt(h,16); return isNaN(n)||h.length!==6?null:[n>>16&255,n>>8&255,n&255]; }
function rgbToCmyk([r,g,b]){ r/=255; g/=255; b/=255; const k=1-Math.max(r,g,b); if(k>=1) return [0,0,0,100]; return [r,g,b].map(x=>Math.round((1-x-k)/(1-k)*100)).concat(Math.round(k*100)); }

  $("#mdZo").onclick=()=>moodZoom(MB.b.zoom/1.2); $("#mdZi").onclick=()=>moodZoom(MB.b.zoom*1.2); $("#mdFit").onclick=moodFit;
  const w=$("#mdWrap");

    moodFiles([...e.dataTransfer.files].filter(f=>f.type.startsWith("image/")),{x:(e.clientX-r.left+w.scrollLeft)/z,y:(e.clientY-r.top+w.scrollTop)/z}); });
  w.addEventListener("wheel",e=>{ if(!(e.ctrlKey||e.metaKey)) return; e.preventDefault(); moodZoom(MB.b.zoom*(e.deltaY<0?1.1:1/1.1)); },{passive:false});
  w.addEventListener("pointerdown",moodPointer);

function moodClose(){ document.getElementById("mood")?.remove(); MB=null; save(); render(); }
function moodCenter(){ const w=$("#mdWrap"), z=MB.b.zoom; return {x:(w.scrollLeft+w.clientWidth/2)/z,y:(w.scrollTop+w.clientHeight/2)/z}; }
function moodZoom(z){ if(!MB) return; const w=$("#mdWrap"), c0=moodCenter(); z=Math.min(2.5,Math.max(.2,z)); MB.b.zoom=z;
  $("#mdCanvas").style.transform=`scale(${z})`; $("#mdSize").style.width=6000*z+"px"; $("#mdSize").style.height=4500*z+"px";
  w.scrollLeft=c0.x*z-w.clientWidth/2; w.scrollTop=c0.y*z-w.clientHeight/2; $("#mdZv").textContent=Math.round(z*100)+"%"; save(); }
function moodFit(){ const it=MB.b.items; if(!it.length) return moodZoom(1); const w=$("#mdWrap");
  const x0=Math.min(...it.map(i=>i.x)), y0=Math.min(...it.map(i=>i.y)), x1=Math.max(...it.map(i=>i.x+i.w)), y1=Math.max(...it.map(i=>i.y+i.h));
  const z=Math.min(2.5,Math.max(.2,Math.min((w.clientWidth-80)/(x1-x0),(w.clientHeight-80)/(y1-y0)))); moodZoom(z); w.scrollLeft=x0*z-40; w.scrollTop=y0*z-40; }
function moodDraw(){
  const cv=$("#mdCanvas"); if(!cv) return; const items=MB.b.items;
  $("#mdEmpty").style.display=items.length?"none":"";
  cv.innerHTML=items.map(i=>`<div class="mitem ${i.type} ${MB.sel===i.id?"sel":""}" data-mid="${i.id}" style="left:${i.x}px;top:${i.y}px;width:${i.w}px;height:${i.h}px;z-index:${i.z||1}">
      ${i.type==="img"?`<img alt="" draggable="false" data-src="${i.id}">`:`<div class="mtbar"></div><div class="mtext" contenteditable="true" data-mtext="${i.id}" spellcheck="false">${esc(i.text||"")}</div>`}
      <button class="mdel" data-mdel="${i.id}" aria-label="Remover">×</button><span class="mh" data-mh="${i.id}"></span></div>`).join("");
  cv.querySelectorAll("img[data-src]").forEach(im=>mediaGet(im.dataset.src).then(u=>{ if(u) im.src=u; }));
  cv.querySelectorAll("[data-mtext]").forEach(t=>t.addEventListener("input",()=>{ const it=items.find(x=>x.id===t.dataset.mtext); if(it){ it.text=t.innerText; save(); } }));
  cv.querySelectorAll("[data-mdel]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); moodDel(b.dataset.mdel); });

function moodDel(id){ const it=MB.b.items.find(x=>x.id===id); if(!it) return; MB.b.items=MB.b.items.filter(x=>x!==it); if(it.type==="img"){ IDB.del(id).catch(()=>{}); delete MEDIA[id]; } MB.sel=null; save(); moodDraw(); }
function moodAdd(item,edit){ item.id=item.id||"m"+Date.now()+Math.floor(Math.random()*1e4); item.z=Math.max(0,...MB.b.items.map(i=>i.z||1))+1; MB.b.items.push(item); MB.sel=item.id; save(); moodDraw();
  if(edit) document.querySelector(`[data-mtext="${item.id}"]`)?.focus(); }
async function moodFiles(files,at){
  if(!files.length) return; let p=at||moodCenter(), n=0;
  for(const f of files){ try{
    const u=await resizeImg(f,1800,"image/jpeg"); const im=new Image(); await new Promise(r=>{ im.onload=r; im.onerror=r; im.src=u; });
    const w=Math.min(380,im.width||380), h=Math.round(w*((im.height||1)/(im.width||1))), id="m"+Date.now()+Math.floor(Math.random()*1e4);
    await IDB.set(id,u); MEDIA[id]=u; moodAdd({id,type:"img",x:p.x-w/2+n*30,y:p.y-h/2+n*30,w,h}); n++;
  }catch(e){ toast("Não consegui adicionar uma das imagens"); } }
}
function moodPointer(e){
  if(!MB||e.button!==0) return;
  const handle=e.target.closest("[data-mh]"), item=e.target.closest("[data-mid]"), w=$("#mdWrap"), z=MB.b.zoom;
  if(e.target.closest(".mdel")) return;
  if(item&&e.target.closest(".mtext")&&document.activeElement===e.target.closest(".mtext")) return;
  const sx=e.clientX, sy=e.clientY;
  if(!item){ // arrastar o fundo = mover a tela
    MB.sel=null; document.querySelectorAll(".mitem.sel").forEach(x=>x.classList.remove("sel")); if(document.activeElement?.blur) document.activeElement.blur();
    const l0=w.scrollLeft, t0=w.scrollTop; w.classList.add("panning");
    const mv=ev=>{ w.scrollLeft=l0-(ev.clientX-sx); w.scrollTop=t0-(ev.clientY-sy); };
    const up=()=>{ w.classList.remove("panning"); removeEventListener("pointermove",mv); removeEventListener("pointerup",up); };
    addEventListener("pointermove",mv); addEventListener("pointerup",up); return;
  }
  const it=MB.b.items.find(x=>x.id===item.dataset.mid); if(!it) return;
  e.preventDefault(); MB.sel=it.id; document.querySelectorAll(".mitem.sel").forEach(x=>x.classList.remove("sel")); item.classList.add("sel");
  it.z=Math.max(0,...MB.b.items.map(i=>i.z||1))+1; item.style.zIndex=it.z;
  const x0=it.x,y0=it.y,w0=it.w,h0=it.h, ratio=h0/w0; let moved=false;
  const mv=ev=>{ const dx=(ev.clientX-sx)/z, dy=(ev.clientY-sy)/z; if(Math.abs(dx)+Math.abs(dy)>2) moved=true;
    if(handle){ it.w=Math.max(60,w0+dx); it.h=it.type==="img"?Math.round(it.w*ratio):Math.max(50,h0+dy); item.style.width=it.w+"px"; item.style.height=it.h+"px"; }
    else { it.x=x0+dx; it.y=y0+dy; item.style.left=it.x+"px"; item.style.top=it.y+"px"; } };
  const up=()=>{ removeEventListener("pointermove",mv); removeEventListener("pointerup",up); save();
    if(!moved&&it.type==="text"&&!handle) item.querySelector(".mtext")?.focus(); };
  addEventListener("pointermove",mv); addEventListener("pointerup",up);
}
document.addEventListener("paste",e=>{
  if(!MB) return; const files=[...(e.clipboardData?.items||[])].filter(i=>i.type.startsWith("image/")).map(i=>i.getAsFile()).filter(Boolean);
  if(files.length){ e.preventDefault(); moodFiles(files); return; }
  if(document.activeElement?.isContentEditable) return;
  const txt=e.clipboardData?.getData("text/plain"); if(txt){ e.preventDefault(); const p=moodCenter(); moodAdd({type:"text",x:p.x-120,y:p.y-60,w:240,h:120,text:txt}); }
});
document.addEventListener("keydown",e=>{
  if(!MB) return;
  if(e.key==="Escape"){ if(document.activeElement?.isContentEditable){ document.activeElement.blur(); return; } moodClose(); return; }
  if((e.key==="Delete"||e.key==="Backspace")&&MB.sel&&!document.activeElement?.isContentEditable&&!/INPUT|TEXTAREA/.test(document.activeElement?.tagName||"")){ e.preventDefault(); moodDel(MB.sel); }

function buildPrompt(pend){
  const open=S.tasks.filter(t=>t.status!=="done").map(t=>({id:t.id,title:t.title,client:t.client,due:t.due,checklist:t.check.map(c=>c.t)}));
  return `Você organiza as anotações rápidas de um designer freelancer (Ogura Studio) dentro do app de tarefas dele.
Hoje é ${todayISO()} (${new Date().toLocaleDateString("pt-BR",{weekday:"long"})}).
Clientes válidos: ${Object.keys(CLIENTS).join(", ")}.
Tarefas abertas (JSON): ${JSON.stringify(open)}

Para cada anotação abaixo, decida o destino:
- "check": é um passo ou ajuste de uma tarefa existente → vira item do checklist dela.
- "note": é informação/contexto de uma tarefa existente (contato, referência, decisão) → vai para as anotações dela.
- "new": é uma demanda que não cabe em nenhuma tarefa existente → cria tarefa nova.
Prefira uma tarefa existente do mesmo cliente quando fizer sentido. Se o cliente não for citado e não der para deduzir, use "Ogura Studio".

Anotações (JSON): ${JSON.stringify(pend.map(n=>({note_id:n.id,text:n.text})))}

Responda SOMENTE com um array JSON, um objeto por anotação:
[{"note_id":123,"kind":"check"|"note"|"new","task_id":<id da tarefa existente ou null>,"text":"texto curto e limpo do item, em português","title":"título da tarefa nova (só se new)","client":"um dos clientes válidos (só se new)","prio":"alta"|"media"|"baixa","due":"AAAA-MM-DD ou null (só se new; converta 'sexta', 'amanhã' etc.)"}]`;
}

function heuristic(n){
  const low=n.text.toLowerCase();
  const client=Object.keys(CLIENTS).find(c=>low.includes(c.toLowerCase())||c.toLowerCase().split(/[ .]+/).some(w=>w.length>3&&low.includes(w)));
  const due=/amanh/.test(low)?d(1):/hoje/.test(low)?d(0):null;
  if(client){
    const t=S.tasks.filter(x=>x.client===client&&x.status!=="done").sort((a,b)=>(a.due||"9")>(b.due||"9")?1:-1)[0];
    if(t) return {kind:"check",task_id:t.id,text:n.text};
  }
  return {kind:"new",title:n.text.length>60?n.text.slice(0,57)+"…":n.text,client:client||"Ogura Studio",prio:/urgente|hoje/.test(low)?"alta":"media",due:due||d(2),text:n.text};
}

function apply(n,p){
  let t = p.kind!=="new" ? S.tasks.find(x=>x.id==p.task_id) : null;
  if(p.kind!=="new" && !t) p={...heuristic(n),kind:"new"};
  const text=(p.text||n.text).trim();
  if(p.kind==="new"){
    t={id:Date.now()+Math.floor(Math.random()*1000),title:p.title||text,client:CLIENTS[p.client]?p.client:"Ogura Studio",prio:PRIO[p.prio]?p.prio:"media",status:"todo",due:/^\d{4}-\d\d-\d\d$/.test(p.due||"")?p.due:d(2),src:"claude",check:[],notes:n.text};
    S.tasks.unshift(t);
  } else if(p.kind==="note"){
    t.notes=(t.notes?t.notes+"\n":"")+"• "+text;
  } else {
    t.check.push({t:text,ok:false});
  }
  Object.assign(n,{status:"done",kind:p.kind,taskId:t.id,added:text});
}

async function organize(){
  if(organizing) return;
  const pend=S.notes.filter(n=>n.status==="pending"); if(!pend.length) return;
  organizing=true;
  let plan=null;
  const sample=await getSample();
  if(sample){
    try{ plan=await sample.json(buildPrompt(pend),{modelTier:"quick",cache:false}); aiMode=true; }
    catch(e){ plan=null; }
  }
  if(!Array.isArray(plan)){ aiMode=false; plan=[]; }
  pend.forEach(n=>apply(n, plan.find(x=>String(x.note_id)===String(n.id)) || heuristic(n)));
  organizing=false; save(); render(); renderNotes();
  toast(pend.length>1?`${pend.length} notas organizadas`:"Nota organizada");
  if(S.notes.some(n=>n.status==="pending")) organize();
}

function undoNote(id){
  const n=S.notes.find(x=>x.id==id); if(!n) return;
  const t=S.tasks.find(x=>x.id==n.taskId);
  if(t){
    if(n.kind==="new") S.tasks=S.tasks.filter(x=>x!==t);
    else if(n.kind==="note") t.notes=t.notes.replace(new RegExp("\\n?• "+n.added.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"$"),"");
    else { const i=t.check.map(c=>c.t).lastIndexOf(n.added); if(i>-1) t.check.splice(i,1); }
  }
  S.notes=S.notes.filter(x=>x!==n); save(); render(); renderNotes(); toast("Nota desfeita");
}

  if(el.id==="clSync") return cloudSync(true);
  if(el.id==="clOut") return cloudLogout();
  if(el.id==="clUseCloud"){ CLOUD.choice=false; cloudPull(true).then(()=>{ render(); toast("Estúdio carregado da nuvem"); }); return; }
  if(el.id==="clUseLocal"){ CLOUD.choice=false; CLOUD.dirty=true; cloudPush(true).then(()=>{ render(); toast("Dados deste aparelho enviados para a nuvem"); }); return; }
  if(el.id==="nbCreate"){ const bf=S.briefs.find(b=>b.id===$("#nbForm").value); if(!bf) return toast("Crie um formulário primeiro");
    const c=$("#nbClient").value, title=$("#nbTitle").value.trim()||`Briefing: ${bf.name}`;
    const t=norm({id:Date.now(),title,client:c,prio:"media",status:"todo",due:d(7),src:"manual",check:[],notes:"",stage:0});
    t.brief={id:bf.id,name:bf.name,qs:JSON.parse(JSON.stringify(bf.questions)),a:[]}; S.tasks.unshift(t); save(); render(); openTask(t.id);
    setTimeout(()=>document.querySelector('[data-bq="0"]')?.scrollIntoView({block:"center"}),60); return toast("Card criado com o briefing"); }
  if(el.dataset.mood) return moodOpen(el.dataset.mood);
  if(el.dataset.pcopy) return copyText(el.dataset.pcopy.toUpperCase());
  if(el.dataset.pdel!=null&&S.client){ S.clientInfo[S.client].palette.splice(+el.dataset.pdel,1); save(); return render(); }
  if(el.id==="cpAdd"&&S.client){ let h=($("#cpHex").value.trim()||$("#cpPick").value); if(!h.startsWith("#")) h="#"+h; if(!hexToRgb(h)) return toast("Cor inválida. Use o formato #RRGGBB");
    const inf=S.clientInfo[S.client]||(S.clientInfo[S.client]={}); (inf.palette||(inf.palette=[])).push({hex:h.toUpperCase(),name:""}); save(); return render(); }
  if(el.dataset.qrtype){ qrState().type=el.dataset.qrtype; save(); return render(); }
  if(el.id==="qrPng") return qrDownload(false);
  if(el.id==="qrSvg") return qrDownload(true);
  if(el.dataset.cvp){ const [w,h,u]=el.dataset.cvp.split(","); $("#cvW").value=w; $("#cvH").value=h; $("#cvU").value=u; return toolsCalc(); }
  if(el.id==="tcUseRate"){ $("#tcRate").value=Math.round((S.tools.goal+S.tools.fixed)/S.tools.month); toolsCalc(); return toast("Valor da hora atualizado"); }
  if(el.id==="wdCopy") return copyText(dateBR(S.tools.wdDate));
  if(el.id==="tcQuote"){ const q=blankQuote(); q.client=S.tools.client||""; q.project=S.tools.job||""; q.items=[{ref:"",d:S.tools.job||"Serviço",desc:"",q:1,v:S.tools.price}];
    S.quotes.push(q); S.page="quotes"; S.quoteId=q.id; save(); render(); return toast("Orçamento criado com "+brl(S.tools.price)); }
  if(el.id==="bfNew"){ S.briefs.push({id:"bf"+Date.now(),name:"Novo formulário",questions:[{q:"Qual o objetivo?"},{q:"Quais peças e formatos?",list:true}]}); save(); render(); return; }
  if(el.dataset.bfdel){ S.briefs=S.briefs.filter(b=>b.id!==el.dataset.bfdel); save(); render(); return toast("Formulário excluído"); }
  if(el.dataset.auto){ const k=el.dataset.auto;
    if(k==="backup"){ if(!S.auto.backup&&!S.auto.folder) return setupDrive(false); S.auto.backup=!S.auto.backup; save(); render(); if(S.auto.backup) autoBackup(true); return; }
    if(k==="remind"){ S.auto.remind=!S.auto.remind; save(); return render(); }
    if(k==="login"&&DESK){ DESK.loginItem(!S.auto.login).then(on=>{ S.auto.login=on; save(); render(); toast(on?"Vai abrir junto com o Mac":"Não abre mais sozinho"); }); return; } }
  if(el.id==="drvUse") return setupDrive(false);
  if(el.id==="drvPick") return setupDrive(true);
  if(el.id==="drvNow") return autoBackup(true);
  if(el.id==="drvOpen"&&DESK) return DESK.openPath(S.auto.folder);
  if(el.id==="ntTest"&&DESK){ DESK.notify({title:"Ogura Studio",body:remindBody()||"As notificações estão funcionando."}); return; }
  if(el.hasAttribute("data-clogodel")){ if(S.client&&S.clientInfo[S.client]){ delete S.clientInfo[S.client].logo; save(); render(); } return; }
  if(el.id==="pfSignDel"){ S.profile.sign=""; save(); return render(); }
  if(el.id==="pfPhotoDel"){ S.profile.photo=""; save(); return render(); }
  if(el.dataset.sw){ document.querySelectorAll(".sw").forEach(x=>x.classList.toggle("on",x===el)); return; }
  if(el.id==="ncAdd") return addClient($("#ncName").value, document.querySelector(".sw.on")?.dataset.sw);
  if(el.dataset.copen){ S.page="tasks"; S.client=el.dataset.copen; S.scope="all"; return render(); }
  if(el.dataset.cdelc){ const k="del:"+el.dataset.cdelc; if(confirmAct===k){ confirmAct=null; return deleteClient(el.dataset.cdelc); } confirmAct=k; render(); setTimeout(()=>{ if(confirmAct===k){ confirmAct=null; if(S.page==="settings") render(); } },4000); return; }
  if(el.id==="resetZero"||el.id==="resetDemo"){ if(confirmAct===el.id){ confirmAct=null; return resetAll(el.id==="resetDemo"); } const k=el.id; confirmAct=k; render(); setTimeout(()=>{ if(confirmAct===k){ confirmAct=null; if(S.page==="settings") render(); } },4000); return; }
  if(el.id==="bkExport") return exportBackup();
  if(el.dataset.play) return toggleTimer(el.dataset.play);
  if(el.dataset.pay){ const t=S.tasks.find(x=>x.id==el.dataset.pay); t.paid=true; save(); render(); return toast("Marcado como pago"); }
  if(el.dataset.fin){ S.finOff+=+el.dataset.fin; return render(); }
  if(el.dataset.tplrun){ const tp=S.templates.find(x=>x.id===el.dataset.tplrun); const t=fromTemplate(tp); save(); toast("Card criado: "+t.title); return; }
  if(el.dataset.tpldel){ S.templates=S.templates.filter(x=>x.id!==el.dataset.tpldel); save(); render(); return toast("Modelo excluído"); }
  if(el.id==="tplNew"){ S.templates.unshift({id:"t"+Date.now(),name:"Novo modelo",client:"Ogura Studio",prio:"media",check:[],value:0,wd:null,offset:3,last:null}); save(); render(); setTimeout(()=>{ const i=document.querySelector(".tplname"); i&&i.select(); },20); return; }
  if(el.id==="sumBtn") return summarize();
  if(el.dataset.toggle){ const t=S.tasks.find(x=>x.id==el.dataset.toggle); setStatus(t,t.status==="done"?"todo":"done"); return; }
  if(el.dataset.page){ S.page=el.dataset.page; if(el.dataset.scope){ S.scope=el.dataset.scope; S.client=null; } $("#side").classList.remove("open"); return render(); }
  if(el.dataset.gtoggle){ const g=S.groups.find(x=>x.id===el.dataset.gtoggle); if(g){ g.open=!g.open; save(); render(); } return; }
  if(el.dataset.group&&!el.dataset.gtoggle){ S.page="group"; S.groupId=el.dataset.group; S.client=null; $("#side").classList.remove("open"); return render(); }
  if(el.dataset.gremove){ const g=S.groups.find(x=>x.id===S.groupId); if(g){ g.members=g.members.filter(m=>m!==el.dataset.gremove); save(); render(); toast(el.dataset.gremove+" saiu do grupo"); } return; }
  if(el.id==="ngAdd"){ const nm=$("#ngName").value.trim(); if(!nm) return toast("Digite o nome do grupo"); S.groups.push({id:"g"+Date.now(),name:nm,color:PALETTE[(S.groups.length+3)%PALETTE.length],members:[],open:true,pad:""}); save(); render(); return toast("Grupo criado: "+nm); }
  if(el.dataset.gdel){ const k="gdel:"+el.dataset.gdel; if(confirmAct===k){ confirmAct=null; S.groups=S.groups.filter(g=>g.id!==el.dataset.gdel); save(); render(); return toast("Grupo apagado. Os clientes continuam."); } confirmAct=k; render(); setTimeout(()=>{ if(confirmAct===k){ confirmAct=null; if(S.page==="settings") render(); } },4000); return; }
  if(el.id==="gNewBtn"){ const g=S.groups.find(x=>x.id===S.groupId), nm=$("#gNewName").value.trim(); if(!g||!nm) return toast("Digite o nome do cliente");
    if(!CLIENTS[nm]) CLIENTS[nm]=PALETTE[Object.keys(CLIENTS).length%PALETTE.length]; S.groups.forEach(x=>{ x.members=x.members.filter(m=>m!==nm); }); g.members.push(nm); save(); render(); return toast(nm+" entrou no grupo"); }
  if(el.hasAttribute("data-glogodel")){ const g=S.groups.find(x=>x.id===S.groupId); if(g){ delete g.logo; save(); render(); } return; }
  if(el.dataset.client){ S.page="tasks"; S.client=el.dataset.client; S.scope="all"; $("#side").classList.remove("open"); return render(); }
  if(el.dataset.view){ S.view=el.dataset.view; return render(); }
  if(el.dataset.prio){ S.prio=S.prio===el.dataset.prio?null:el.dataset.prio; return render(); }
  if(el.hasAttribute("data-clear")){ S.prio=null; S.client=null; S.q=""; $("#q").value=""; return render(); }
  if(el.dataset.cal){ S.calOff+=+el.dataset.cal; return render(); }
  if(el.dataset.addcol){ return newTask(el.dataset.addcol); }
  if(el.dataset.conn){ const k=el.dataset.conn; S.conns[k]=!S.conns[k]; save(); toast(S.conns[k]?"Conectado":"Desconectado"); return render(); }
  if(el.dataset.id && !el.closest(".drawer")) return openTask(el.dataset.id);
});
$("#newBtn").onclick=()=>newTask();
$("#content").addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.id==="clPass") $("#clLogin").click(); if(e.key==="Enter"&&e.target.id==="ngName") $("#ngAdd").click(); if(e.key==="Enter"&&e.target.id==="gNewName") $("#gNewBtn").click(); if(e.key==="Enter"&&e.target.dataset.gren!=null) e.target.blur();
  if(e.key==="Enter"&&e.target.id==="ncName") addClient(e.target.value, document.querySelector(".sw.on")?.dataset.sw); if(e.key==="Enter"&&e.target.dataset.cren!=null) e.target.blur(); });
$("#content").addEventListener("input",e=>{
  const f=e.target, q=S.quotes.find(x=>x.id===S.quoteId); if(!q||S.page!=="quotes") return;
  if(f.dataset.qf){ let v=f.type==="checkbox"?f.checked:f.value; if(["validity","discount","pay1Pct","pay2N"].includes(f.dataset.qf)) v=+v||0; q[f.dataset.qf]=v; if(f.dataset.qf==="status"&&v==="approved") q.approvedAt=todayISO(); }
  else if(f.dataset.qi!=null){ const it=q.items[+f.dataset.qi]; it[f.dataset.k]=["d","ref","desc"].includes(f.dataset.k)?f.value:(+f.value||0);
    const r=document.querySelector(`[data-qrow="${f.dataset.qi}"]`); if(r) r.textContent=brl((+it.q||0)*(+it.v||0)); }
  else return;
  save(); $("#qdoc").innerHTML=quoteDoc(q); fitDoc();
});
let dragC=null;
$("#content").addEventListener("mousedown",e=>{ const g=e.target.closest(".grip"); if(g) g.closest("[data-cdrag]").draggable=true; });
$("#content").addEventListener("dragstart",e=>{ const it=e.target.closest&&e.target.closest("[data-cdrag]"); if(!it||!it.draggable) return; dragC=it.dataset.cdrag; e.dataTransfer.effectAllowed="move"; try{ e.dataTransfer.setData("text/plain",dragC) }catch(err){} it.classList.add("dragging"); });
$("#content").addEventListener("dragover",e=>{ const it=e.target.closest&&e.target.closest("[data-cdrag]"); if(!dragC||!it) return; e.preventDefault();
  const r=it.getBoundingClientRect(), after=e.clientY>r.top+r.height/2; document.querySelectorAll(".citem").forEach(x=>x.classList.remove("drop-b","drop-a")); it.classList.add(after?"drop-a":"drop-b"); });
$("#content").addEventListener("drop",e=>{ const it=e.target.closest&&e.target.closest("[data-cdrag]"); if(!dragC||!it) return; e.preventDefault();
  const r=it.getBoundingClientRect(); const from=dragC; dragC=null; moveClient(from,it.dataset.cdrag,e.clientY>r.top+r.height/2); });
$("#content").addEventListener("dragend",e=>{ if(!dragC&&!e.target.closest?.("[data-cdrag]")) return; dragC=null; document.querySelectorAll(".citem").forEach(x=>{ x.classList.remove("dragging","drop-a","drop-b"); x.draggable=false; }); });
$("#content").addEventListener("input",e=>{
  if(e.target.dataset.qr){ const q=qrState(), k=e.target.dataset.qr; q[k]=e.target.type==="checkbox"?e.target.checked:e.target.value;
    if(["logo","transp","logoClient"].includes(k)){ save(); return render(); } return qrUpdate(); }
  if(S.page==="tools") return toolsCalc();
  if(e.target.id==="cpPick"){ const h=$("#cpHex"); if(h) h.value=e.target.value.toUpperCase(); }
});
$("#timerChip").onclick=()=>{ if(S.timer) toggleTimer(S.timer.id); };
$("#content").addEventListener("change",e=>{
  const f=e.target;
  if(f.id==="bkImport"&&f.files[0]) return importBackup(f.files[0]);
  if(f.dataset.cloud){ S.cloud[f.dataset.cloud]=f.value.trim(); save(); return render(); }
  if(f.hasAttribute("data-qrlogo")&&f.files[0]){ resizeImg(f.files[0],500,"image/png").then(u=>{ qrState().logoData=u; save(); render(); }); return; }
  if(f.id==="bfFilter"){ S.briefFilter=f.value; return render(); }
  if(f.dataset.pname!=null&&S.client){ S.clientInfo[S.client].palette[+f.dataset.pname].name=f.value.trim(); save(); return; }
  if(f.hasAttribute("data-autotime")){ S.auto.time=f.value||"09:00"; if(f.value>pad(new Date().getHours())+":"+pad(new Date().getMinutes())) S.auto.lastSummary=null; save(); return toast("Resumo diário às "+S.auto.time); }
  if(f.dataset.bf){ const b=S.briefs.find(x=>x.id===f.closest("[data-brief]").dataset.brief); if(!b) return;
    if(f.dataset.bf==="name") b.name=f.value.trim()||b.name;
    else b.questions=f.value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>l.startsWith("*")?{q:l.replace(/^\*\s*/,""),list:true}:{q:l});
    save(); render(); return; }
  if(f.dataset.cgroup!=null){ const c=f.dataset.cgroup; S.groups.forEach(g=>{ g.members=g.members.filter(m=>m!==c); }); const g=S.groups.find(x=>x.id===f.value); if(g) g.members.push(c); save(); render(); return; }
  if(f.dataset.gadd!=null&&f.value){ const g=S.groups.find(x=>x.id===S.groupId); if(g){ g.members.push(f.value); save(); render(); toast(f.value+" entrou no grupo"); } return; }
  if(f.dataset.gcol){ const g=S.groups.find(x=>x.id===f.dataset.gcol); if(g){ g.color=f.value; save(); render(); } return; }
  if(f.dataset.gren){ const g=S.groups.find(x=>x.id===f.dataset.gren); if(g&&f.value.trim()){ g.name=f.value.trim(); save(); render(); } return; }
  if(f.hasAttribute("data-glogo")&&f.files[0]){ const g=S.groups.find(x=>x.id===S.groupId); if(g) resizeImg(f.files[0],320,"image/png").then(u=>{ g.logo=u; if(!save()) toast("Imagem grande demais"); render(); }); return; }
  if(f.hasAttribute("data-clogo")&&f.files[0]&&S.client){ resizeImg(f.files[0],320,"image/png").then(u=>{ (S.clientInfo[S.client]||(S.clientInfo[S.client]={})).logo=u; if(!save()) toast("Imagem grande demais"); render(); }).catch(()=>toast("Não consegui ler essa imagem")); return; }
  if(f.hasAttribute("data-pfsign")&&f.files[0]){ resizeImg(f.files[0],700,"image/png").then(u=>{ S.profile.sign=u; save(); render(); }).catch(()=>toast("Não consegui ler essa imagem")); return; }
  if(f.hasAttribute("data-pfphoto")&&f.files[0]){ resizeImg(f.files[0],256,"image/jpeg").then(u=>{ S.profile.photo=u; save(); render(); }).catch(()=>toast("Não consegui ler essa imagem")); return; }
  if(f.dataset.pf){ S.profile[f.dataset.pf]=f.value.trim(); save(); renderUser(); return; }
  if(f.dataset.ccol){ CLIENTS[f.dataset.ccol]=f.value; save(); render(); return; }
  if(f.dataset.cren!=null){ return renameClient(f.dataset.cren,f.value); }
    if(f.dataset.cf && S.client){ (S.clientInfo[S.client]||(S.clientInfo[S.client]={}))[f.dataset.cf]=f.value.trim(); save(); if(["drive","fone","wgroup"].includes(f.dataset.cf)) render(); return; }
  if(f.dataset.tf){ const tp=S.templates.find(x=>x.id===f.closest("[data-tpl]").dataset.tpl), k=f.dataset.tf; let v=f.value;
    if(k==="check") v=v.split("\n").map(x=>x.trim()).filter(Boolean);
    if(k==="value"||k==="offset") v=+v||0;
    if(k==="wd"){ v=v===""?null:+v; tp.last=v==null?null:occ(v); }
    tp[k]=v; save(); if(k==="wd") render(); }
});
$("#q").addEventListener("input",e=>{ S.q=e.target.value; render(); });
$("#menuBtn").onclick=()=>$("#side").classList.toggle("open");
const isDark=()=>{ const r=document.documentElement; return r.dataset.theme? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme:dark)").matches; };
function themeIcon(){ const b=$("#themeBtn"), dk=isDark(), lbl=dk?"Mudar para tema claro":"Mudar para tema escuro";
  b.innerHTML=ico(dk?"sun":"moon"); b.setAttribute("aria-label",lbl); b.title=lbl; }
$("#themeBtn").onclick=()=>{ const t=isDark()?"light":"dark"; document.documentElement.dataset.theme=t; try{ localStorage.setItem("ogura.theme",t) }catch(e){} themeIcon(); };
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",themeIcon);
try{ const t=localStorage.getItem("ogura.theme"); if(t) document.documentElement.dataset.theme=t; }catch(e){}
themeIcon();
function setCollapsed(c){ $("#app").classList.toggle("collapsed",c); const b=$("#collapseBtn"), lbl=c?"Expandir painel":"Recolher painel";
  b.innerHTML=ico(c?"expand":"collapse"); b.setAttribute("aria-label",lbl); b.title=lbl; try{ localStorage.setItem("ogura.collapsed",c?"1":"") }catch(e){} }
$("#collapseBtn").onclick=()=>{ if(innerWidth<=860){ $("#side").classList.remove("open"); return; } setCollapsed(!$("#app").classList.contains("collapsed")); };
setCollapsed(!!load("collapsed"));
document.querySelector("main").addEventListener("click",e=>{ if(innerWidth<=860 && $("#side").classList.contains("open") && !e.target.closest("#menuBtn")) $("#side").classList.remove("open"); });
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && S.openId) closeDrawer();
  if(e.key==="n" && !MB && !e.target.isContentEditable && !e.target.closest("input,textarea,select") && !S.openId) newTask();
});

/* Entrar direto se já logado (no fim, depois de tudo carregado) */
enter();
</script>
</body>
