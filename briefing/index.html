.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.12em;color:#6E675D;text-transform:uppercase}
.red{color:var(--red)}
h1{font-stretch:125%;font-weight:900;font-size:clamp(40px,11vw,60px);line-height:1;margin:22px 0 8px;letter-spacing:-.01em}
h1 span{color:var(--red)}
.intro{margin:0 0 6px;font-size:16.5px}
.meta{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);margin:20px 0 26px}
.meta div{padding:10px 0}.meta div+div{padding-left:12px;border-left:1px solid var(--line)}
.meta b{display:block;font-size:16px;margin-top:2px}
.q{margin-bottom:22px}
.q label{display:flex;gap:10px;font-weight:700;font-size:17px;line-height:1.35;margin-bottom:8px}
.q label i{font-style:normal;font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:12px;color:var(--red);padding-top:4px;flex:none}
.q small{display:block;color:var(--ink3);font-weight:400;font-size:13px;margin:-4px 0 8px 30px}
textarea{width:100%;min-height:84px;resize:vertical;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;color:var(--ink);outline:none;transition:border-color .15s}
textarea:focus{border-color:var(--ink)}
.up{border:1.5px dashed var(--ink3);border-radius:12px;padding:20px;text-align:center;background:var(--card);cursor:pointer;display:block}
.up b{display:block;font-size:16px}
.up span{color:var(--ink2);font-size:14px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:10px}
.th{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.th img{width:100%;height:100%;object-fit:cover}
.th button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1;cursor:pointer}
.send{width:100%;margin-top:26px;background:var(--ink);color:#fff;border:0;border-radius:12px;padding:17px;font:inherit;font-weight:800;font-size:17px;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:10px}
.send:disabled{opacity:.6;cursor:default}
.send .dot{width:10px;height:10px;border-radius:50%;background:var(--red)}
.note{color:var(--ink3);font-size:13px;text-align:center;margin-top:10px}
.state{text-align:center;padding:60px 10px}
.state h2{font-stretch:125%;font-weight:900;font-size:34px;margin:0 0 10px;line-height:1.05}
.state h2 span{color:var(--red)}
.foot{margin-top:40px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.err{background:#fde3df;color:#8a1c10;border-radius:10px;padding:10px 14px;margin-top:14px;font-size:14px}
</style></head>
<body><div class="wrap">
  <div class="head"><div class="logo" role="img" aria-label="Ogura Studio"></div><div class="mono" style="text-align:right">Briefing<br>de projeto</div></div>
  <main id="main"><div class="state"><p class="mono">Carregando…</p></div></main>
  <div class="foot mono"><span>Ogura Studio</span><span id="footR"></span></div>
</div>
<script>
const SB_URL="https://inxmzcovkcdnjyrsieqg.supabase.co", SB_KEY="sb_publishable_qjQVQMPvcIIGE5uxus77Vg_A-fE63Ct";
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const token=new URLSearchParams(location.search).get("b")||"";
let sb=null, B=null, files=[];
function state(title,text){ $("#main").innerHTML=`<div class="state"><h2>${title}</h2><p>${text}</p></div>`; }
function resize(file,max){ return new Promise((ok,bad)=>{ const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)), c=document.createElement("canvas"); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height); c.toBlob(b=>b?ok(b):bad(),"image/jpeg",.86); }; im.onerror=bad; im.src=r.result; }; r.onerror=bad; r.readAsDataURL(file); }); }
function drawThumbs(){ $("#thumbs").innerHTML=files.map((f,i)=>`<div class="th"><img src="${f.url}" alt=""><button data-rm="${i}" aria-label="Remover">×</button></div>`).join(""); }
async function addFiles(list){ for(const f of list){ if(!f.type.startsWith("image/")) continue; if(files.length>=12){ alert("Até 12 imagens por briefing."); break; }
  try{ const blob=await resize(f,2000); files.push({blob,url:URL.createObjectURL(blob),name:f.name}); }catch(e){} } drawThumbs(); }
function render(){
  const s=B.studio||{};
  $("#footR").textContent=[s.insta,s.site].filter(Boolean).join(" · ");
  document.title=`Briefing · ${B.job||""} · Ogura Studio`;
  $("#main").innerHTML=`
    <p class="mono red" style="margin:22px 0 0">${esc(B.form||"Briefing")}</p>
    <h1>Briefing<span>.</span></h1>
    <p class="intro">Olá${B.client?`, <b>${esc(B.client)}</b>`:""}! Responda com calma, do seu jeito. Quanto mais detalhes, melhor fica o resultado.</p>
    <div class="meta"><div><span class="mono">Projeto</span><b>${esc(B.job||"—")}</b></div><div><span class="mono">Designer</span><b>${esc(s.name||"Ogura Studio")}</b></div></div>
    <form id="f">${(B.questions||[]).map((q,i)=>`<div class="q"><label for="q${i}"><i>${String(i+1).padStart(2,"0")}</i>${esc(q.q)}</label>${q.list?`<small>Pode colocar um item por linha.</small>`:""}<textarea id="q${i}" data-i="${i}" rows="3"></textarea></div>`).join("")}
      <div class="q"><label><i>${String((B.questions||[]).length+1).padStart(2,"0")}</i>Imagens (opcional)</label><small>Logo, referências, fotos, prints do que você gosta.</small>
        <label class="up" for="fi"><b>+ Adicionar imagens</b><span>Toque para escolher na galeria ou no computador</span></label><input type="file" id="fi" accept="image/*" multiple hidden>
        <div class="thumbs" id="thumbs"></div></div>
      <button class="send" id="send" type="submit"><span class="dot"></span>Enviar briefing</button>
      <p class="note">Suas respostas vão direto para ${esc(s.name||"o Ogura Studio")}.</p><div id="err"></div>
    </form>`;
  const saved=JSON.parse(localStorage.getItem("brief-"+token)||"[]");
  document.querySelectorAll("textarea[data-i]").forEach(t=>{ t.value=saved[t.dataset.i]||""; t.addEventListener("input",()=>{ const a=[...document.querySelectorAll("textarea[data-i]")].map(x=>x.value); localStorage.setItem("brief-"+token,JSON.stringify(a)); }); });
  $("#fi").onchange=e=>{ addFiles([...e.target.files]); e.target.value=""; };
  $("#thumbs").onclick=e=>{ const i=e.target.dataset.rm; if(i!=null){ files.splice(+i,1); drawThumbs(); } };
  $("#f").onsubmit=submit;
}
async function submit(e){
  e.preventDefault();
  const answers=[...document.querySelectorAll("textarea[data-i]")].map(x=>x.value.trim());
  if(!answers.some(Boolean)&&!files.length){ $("#err").innerHTML=`<div class="err">Responda pelo menos uma pergunta antes de enviar.</div>`; return; }
  const btn=$("#send"); btn.disabled=true; btn.innerHTML=`<span class="dot"></span>Enviando…`; $("#err").innerHTML="";
  try{
    const up=[];
    for(let i=0;i<files.length;i++){ btn.innerHTML=`<span class="dot"></span>Enviando imagens ${i+1}/${files.length}…`;
      const path=`${token}/${Date.now()}-${i}.jpg`; const {error}=await sb.storage.from("briefing-uploads").upload(path,files[i].blob,{contentType:"image/jpeg"}); if(error) throw error; up.push({path,name:files[i].name}); }
    const {data,error}=await sb.rpc("submit_brief",{p_token:token,p_answers:answers,p_files:up}); if(error) throw error;
    if(!data) return state("Este briefing já foi respondido<span>.</span>","Se quiser mudar algo, fale direto com o designer.");
    localStorage.removeItem("brief-"+token); scrollTo(0,0);
    state("Recebido<span>!</span>",`Obrigado${B.client?`, ${esc(B.client)}`:""}. Suas respostas chegaram para ${esc((B.studio||{}).name||"o Ogura Studio")}, que logo entra em contato.`);
  }catch(err){ btn.disabled=false; btn.innerHTML=`<span class="dot"></span>Enviar briefing`; $("#err").innerHTML=`<div class="err">Não consegui enviar agora. Confira a internet e tente de novo. Suas respostas continuam aqui.</div>`; }
}
(async()=>{
  if(!token) return state("Link incompleto<span>.</span>","Peça o link do briefing de novo para o designer.");
  if(typeof supabase==="undefined") return state("Sem conexão<span>.</span>","Confira a internet e recarregue a página.");
  sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false}});
  const {data,error}=await sb.rpc("get_brief",{p_token:token});
  if(error) return state("Sem conexão<span>.</span>","Não consegui abrir o briefing. Confira a internet e recarregue.");
  if(!data) return state("Link não encontrado<span>.</span>","Esse briefing não existe mais. Peça um link novo para o designer.");
  B=data; if(B.answered) return state("Este briefing já foi respondido<span>.</span>","Obrigado! Se quiser mudar algo, fale direto com o designer.");
  render();
})();
</script></body></html>
